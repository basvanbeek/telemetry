version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dogsled
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - contextcheck
    - errname
    - govet
    - prealloc
  settings:
    lll:
      line-length: 160
    goconst:
      min-occurrences: 4
    govet:
      enable:
        - shadow
    funlen:
        lines: 100
        statements: 50
    revive:
      severity: error
      confidence: 0.8
      rules:
        - name: atomic
        - name: blank-imports
        - name: confusing-naming
        - name: get-return
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        # A true empty block is hard to recognize, see https://github.com/mgechev/revive/issues/386
        #- name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: struct-tag
        - name: time-naming
        - name: unexported-naming
        - name: unexported-return
        - name: unhandled-error
          arguments: [
              "fmt.Printf",
              "fmt.Println",
              "fmt.Fprintf",
          ]
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
